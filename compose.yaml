services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"

  backend:
    image: amsberg_digital_universe
    container_name: Amsberg
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
  

volumes:
  mssql_data:
  azurite_data: